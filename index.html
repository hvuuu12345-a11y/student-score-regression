
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Score Regression</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf2ff, #f5f0ff);
            color: #263248;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            max-width: 760px;
            width: 100%;
            padding: 55px 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #3156a3;
        }

        .description {
            color: #68758a;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .feature {
            background: #f2f6ff;
            padding: 18px 10px;
            border-radius: 12px;
            font-size: 14px;
        }

        .feature strong {
            display: block;
            color: #3156a3;
            margin-bottom: 7px;
        }

        .button {
            display: inline-block;
            background: #4268bd;
            color: white;
            padding: 14px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            background: #294b96;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 35px;
            font-size: 13px;
            color: #9aa3b2;
        }

        @media (max-width: 550px) {
            h1 {
                font-size: 25px;
            }

            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">📊</div>

        <h1>Student Score Regression</h1>

        <p class="description">
            Hệ thống phân tích dữ liệu học tập và dự đoán
            điểm thi cuối kỳ của sinh viên bằng mô hình
            hồi quy tuyến tính (Linear Regression).
        </p>

        <div class="features">
            <div class="feature">
                <strong>Attendance</strong>
                Điểm chuyên cần
            </div>

            <div class="feature">
                <strong>Assignment</strong>
                Điểm bài tập
            </div>

            <div class="feature">
                <strong>Midterm</strong>
                Điểm giữa kỳ
            </div>
        </div>

        <a class="button" href="https://student-score-regression-c2ll.onrender.com/" target="_blank">
            Truy cập ứng dụng
        </a>

        <footer>
            Student Score Regression · Linear Regression
        </footer>
    </div>
</body>
</html>
